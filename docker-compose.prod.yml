services:
  ws:
    build:
      context: .
      dockerfile: ./apps/ws/Dockerfile
      args:
        JWT_SECRET: ${JWT_SECRET}
    image: myapp-ws:latest
    environment:
      NODE_ENV: production
      WS_PORT: "8080"
      WS_PATH: "/graphql"
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: postgres://app:app@postgres:5432/appdb
      JWT_SECRET: ${JWT_SECRET}
    # ports:
    #   - "8081:8080"
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_GRAPHQL_HTTP: ${NEXT_PUBLIC_GRAPHQL_HTTP}
        NEXT_PUBLIC_GRAPHQL_WS: ${NEXT_PUBLIC_GRAPHQL_WS}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}

        NEXT_PUBLIC_FACEBOOK_APP_ID: ${NEXT_PUBLIC_FACEBOOK_APP_ID}
        NEXT_PUBLIC_FACEBOOK_APP_SECRET: ${NEXT_PUBLIC_FACEBOOK_APP_SECRET}
        NEXT_PUBLIC_SENDGRID_API_KEY: ${NEXT_PUBLIC_SENDGRID_API_KEY}
        NEXT_PUBLIC_SENDGRID_FROM_EMAIL: ${NEXT_PUBLIC_SENDGRID_FROM_EMAIL}
        NEXT_PUBLIC_SUPPORT_URL: ${NEXT_PUBLIC_SUPPORT_URL}
        NEXT_PUBLIC_SUPPORT_TO_EMAIL: ${NEXT_PUBLIC_SUPPORT_TO_EMAIL}
        COOKIE_SECURE: ${COOKIE_SECURE} 
        WEB_NAME: ${WEB_NAME}

        FB_PAGE_ID: ${FB_PAGE_ID}
        FB_PAGE_ACCESS_TOKEN: ${FB_PAGE_ACCESS_TOKEN}
        SOCIAL_QUEUE_KEY: ${SOCIAL_QUEUE_KEY}
        SOCIAL_DLQ_KEY: ${SOCIAL_DLQ_KEY}
        SOCIAL_DELAYED_KEY: ${SOCIAL_DELAYED_KEY}
        ADMIN_TOKEN: ${ADMIN_TOKEN}
        JWT_SECRET: ${JWT_SECRET}
        DEBUG_LOG: ${DEBUG_LOG}
        DB_LOG: ${DB_LOG}
        DB_LOG_LEVELS: ${DB_LOG_LEVELS}

        FCM_PROJECT_ID: ${FCM_PROJECT_ID}
        FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL}
        FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY}
    image: myapp-web:latest
    environment:
      NODE_ENV: production
      WEB_NAME: ${WEB_NAME}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      NEXT_PUBLIC_GRAPHQL_HTTP: ${NEXT_PUBLIC_GRAPHQL_HTTP}
      NEXT_PUBLIC_GRAPHQL_WS: ${NEXT_PUBLIC_GRAPHQL_WS}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      STORAGE_DIR: /app/storage
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}

      NEXT_PUBLIC_FACEBOOK_APP_ID: ${NEXT_PUBLIC_FACEBOOK_APP_ID}
      NEXT_PUBLIC_FACEBOOK_APP_SECRET: ${NEXT_PUBLIC_FACEBOOK_APP_SECRET}
      NEXT_PUBLIC_SENDGRID_API_KEY: ${NEXT_PUBLIC_SENDGRID_API_KEY}
      NEXT_PUBLIC_SENDGRID_FROM_EMAIL: ${NEXT_PUBLIC_SENDGRID_FROM_EMAIL}
      NEXT_PUBLIC_SUPPORT_URL: ${NEXT_PUBLIC_SUPPORT_URL}
      NEXT_PUBLIC_SUPPORT_TO_EMAIL: ${NEXT_PUBLIC_SUPPORT_TO_EMAIL}

      COOKIE_SECURE: ${COOKIE_SECURE}

      FB_PAGE_ID: ${FB_PAGE_ID}
      FB_PAGE_ACCESS_TOKEN: ${FB_PAGE_ACCESS_TOKEN}
      SOCIAL_QUEUE_KEY: ${SOCIAL_QUEUE_KEY}
      SOCIAL_DLQ_KEY: ${SOCIAL_DLQ_KEY}
      SOCIAL_DELAYED_KEY: ${SOCIAL_DELAYED_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN}

      JWT_SECRET: ${JWT_SECRET}


      DEBUG_LOG: ${DEBUG_LOG}
      DB_LOG: ${DB_LOG}
      DB_LOG_LEVELS: ${DB_LOG_LEVELS}

      FCM_PROJECT_ID: ${FCM_PROJECT_ID}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY}
      
    # ports:
    #   - "80:3000"   # 👈 prod ใช้ port 80 ด้านนอก
    depends_on:
      - postgres
      - redis
      - ws
    volumes:
      - ./storage:/app/storage
      # - /mnt/volume_sgp1_01/storage:/app/storage

  whale-ill-system:
    build:
      context: .
      dockerfile: ./apps/whale-ill-system/Dockerfile
      args:
        WHALE_ILL_APP_NAME: ${WHALE_ILL_APP_NAME}
        WHALE_ILL_PORT: ${WHALE_ILL_PORT:-3010}
        WHALE_ILL_GRAPHQL_PATH: ${WHALE_ILL_GRAPHQL_PATH}
        WHALE_ILL_NEXT_PUBLIC_BASE_URL: ${WHALE_ILL_NEXT_PUBLIC_BASE_URL}
        WHALE_ILL_NEXT_PUBLIC_GRAPHQL_HTTP: ${WHALE_ILL_NEXT_PUBLIC_GRAPHQL_HTTP}
        WHALE_ILL_NEXT_PUBLIC_GRAPHQL_WS: ${WHALE_ILL_NEXT_PUBLIC_GRAPHQL_WS}
    image: myapp-whale-ill-system:latest
    container_name: whale-ill-system
    environment:
      NODE_ENV: production
      WHALE_ILL_APP_NAME: ${WHALE_ILL_APP_NAME}
      WHALE_ILL_GRAPHQL_PATH: ${WHALE_ILL_GRAPHQL_PATH}
      PORT: ${WHALE_ILL_PORT:-3010}
      NEXT_PUBLIC_BASE_URL: ${WHALE_ILL_NEXT_PUBLIC_BASE_URL}
      NEXT_PUBLIC_GRAPHQL_HTTP: ${WHALE_ILL_NEXT_PUBLIC_GRAPHQL_HTTP}
      NEXT_PUBLIC_GRAPHQL_WS: ${WHALE_ILL_NEXT_PUBLIC_GRAPHQL_WS}
      WHALE_DB_HOST: ${WHALE_DB_HOST}
      WHALE_DB_PORT: ${WHALE_DB_PORT}
      WHALE_DB_NAME: ${WHALE_DB_NAME}
      WHALE_DB_USER: ${WHALE_DB_USER}
      WHALE_DB_PASSWORD: ${WHALE_DB_PASSWORD}
      WHALE_ADMIN_TOKEN: ${WHALE_ADMIN_TOKEN}
      ALLOW_DEMO_DATA: ${ALLOW_DEMO_DATA}
      WHALE_ALCHEMY_API_KEY: ${WHALE_ALCHEMY_API_KEY}
      WHALE_COVALENT_API_KEY: ${WHALE_COVALENT_API_KEY}
      WHALE_DUNE_API_KEY: ${WHALE_DUNE_API_KEY}
      WHALE_ARKHAM_API_KEY: ${WHALE_ARKHAM_API_KEY}
      WHALE_SCANNER_INTERVAL_MINUTES: ${WHALE_SCANNER_INTERVAL_MINUTES}
      WHALE_SMART_MONEY_MIN_SCORE: ${WHALE_SMART_MONEY_MIN_SCORE}
      WHALE_MIN_LIQUIDITY_USD: ${WHALE_MIN_LIQUIDITY_USD}
      WHALE_MIN_VOLUME_24H_USD: ${WHALE_MIN_VOLUME_24H_USD}
      WHALE_SCANNER_SYNC_URL: ${WHALE_SCANNER_SYNC_URL}
      WHALE_SCANNER_API_URL: ${WHALE_SCANNER_API_URL}
      WHALE_EXCHANGE_WALLETS_JSON: ${WHALE_EXCHANGE_WALLETS_JSON}
      WHALE_LONG_ALERT_SCORE_MIN: ${WHALE_LONG_ALERT_SCORE_MIN}
      WHALE_ALERT_COOLDOWN_MINUTES: ${WHALE_ALERT_COOLDOWN_MINUTES}
      WHALE_LINE_CHANNEL_ACCESS_TOKEN: ${WHALE_LINE_CHANNEL_ACCESS_TOKEN}
      WHALE_LINE_USER_ID: ${WHALE_LINE_USER_ID}
      WHALE_LINE_NOTIFY_TOKEN: ${WHALE_LINE_NOTIFY_TOKEN}
      REDIS_URL: ${REDIS_URL}
      STORAGE_DIR: /app/storage
    ports:
      - "${WHALE_ILL_PORT:-3010}:${WHALE_ILL_PORT:-3010}"
    depends_on:
      - postgres
      - redis
      - ws
    volumes:
      - ./storage:/app/storage

  whale-scanner-worker:
    image: myapp-whale-ill-system:latest
    working_dir: /app/apps/whale-ill-system
    command: ["node", "scripts/whale-scanner-worker.mjs"]
    environment:
      NODE_ENV: production
      WHALE_ADMIN_TOKEN: ${WHALE_ADMIN_TOKEN}
      WHALE_SCANNER_API_URL: ${WHALE_SCANNER_API_URL:-http://whale-ill-system:3010/api/whale/scan}
      WHALE_SCANNER_INTERVAL_MINUTES: ${WHALE_SCANNER_INTERVAL_MINUTES}
    depends_on:
      - whale-ill-system
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apps/web/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config

  social-worker:
    image: myapp-web:latest
    working_dir: /app/apps/web
    command: ["node", "scripts/social-worker.mjs"]
    environment:
      NODE_ENV: development
      REDIS_URL: ${REDIS_URL}

      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      FB_PAGE_ID: ${FB_PAGE_ID}
      FB_PAGE_ACCESS_TOKEN: ${FB_PAGE_ACCESS_TOKEN}
      SOCIAL_QUEUE_KEY: ${SOCIAL_QUEUE_KEY}
      SOCIAL_DLQ_KEY: ${SOCIAL_DLQ_KEY}
      SOCIAL_DELAYED_KEY: ${SOCIAL_DELAYED_KEY}
    volumes:
      # - ./:/app
      - ./storage:/app/storage
    depends_on:
      - web
      - postgres
      - redis
    restart: unless-stopped
